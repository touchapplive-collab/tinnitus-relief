name: Ripple G3 (silent)

# Experimental spectral-ripple engine: unit tests, isolation checks, silent bench APK, emulator run without audio.
on:
  push:
    branches: [main]
    paths: ["ripple/**", "ripplebench/**", "app/**", ".github/workflows/ripple.yml", "settings.gradle.kts", "build.gradle.kts"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Safety-gate and no-audio checks
        run: |
          set -e
          # audible ripple playback must stay disabled until calibration and explicit approval
          grep -q "const val AUDIBLE_PLAYBACK_AUTHORIZED = false" ripple/src/main/kotlin/com/tinnitusrelief/ripple/engine/Safety.kt || { echo "::error::audible playback is not disabled"; exit 1; }
          # no audio-output (or input) API in the ripple module, the bench, or the app's ripple glue
          if grep -rnE "AudioTrack|AAudio|MediaPlayer|SoundPool|ExoPlayer|media3|OpenSL|[Oo]boe|AudioRecord|ToneGenerator|Ringtone|JetPlayer" ripple/src ripplebench/src app/src/main/java/com/tinnitusrelief/app/ripple; then
            echo "::error::audio API found in ripple code"; exit 1; fi
          echo "::notice title=safety gate::AUDIBLE_PLAYBACK_AUTHORIZED = false; no audio API in ripple code"
      - name: Ripple unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :ripple:test 2>&1 | tee ripple-test.log
      - name: App unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee app-test.log
      - name: Build silent bench APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :ripplebench:assembleDebug :ripplebench:assembleDebugAndroidTest 2>&1 | tee bench-build.log
          cp ripplebench/build/outputs/apk/debug/ripplebench-debug.apk RippleBench-silent.apk
      - name: Report results
        if: always()
        run: |
          for f in ripple-test.log app-test.log bench-build.log; do
            [ -f "$f" ] || continue
            msg=$( { grep -E "^e: |FAILED|PASSED" "$f" | head -60; grep -A12 "What went wrong" "$f" | head -30; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
            [ -n "$msg" ] && echo "::notice title=$f::$msg"
          done
          if [ -d ripple/build/test-results/test ]; then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=0; out=[]
          for x in glob.glob('ripple/build/test-results/test/*.xml'):
              r=ET.parse(x).getroot(); t+=int(r.get('tests')); f+=int(r.get('failures'))+int(r.get('errors'))
              so=r.find('system-out')
              if so is not None and so.text: out+= [l for l in so.text.splitlines() if 'JVM pacing' in l]
          print(f"::notice title=ripple tests::{t} tests, {f} failed%0A" + "%0A".join(out))
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ripplebench
          path: |
            RippleBench-silent.apk
            ripplebench/build/outputs/apk/androidTest/debug/*.apk
      - name: Publish silent bench (separate pre-release, not the app's release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ripplebench
          name: Ripple bench (silent, G3)
          body: "Silent validation app for the experimental engine. It produces no sound. Commit ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: RippleBench-silent.apk

  emulator:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented silent bench on an emulator without audio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --no-daemon --console=plain :ripplebench:connectedDebugAndroidTest :app:connectedDebugAndroidTest > connected.log 2>&1 || (adb logcat -d -s RippleBenchReport:I RippleBench:I AndroidRuntime:E TestRunner:E > bench-logcat.txt; exit 1)
            adb logcat -d -s RippleBenchReport:I > bench-logcat.txt
      - name: Report emulator results
        if: always()
        run: |
          [ -f bench-logcat.txt ] && echo "::notice title=emulator bench::$(sed 's/%/%25/g' bench-logcat.txt | sed -E 's/^.*RippleBench(Report)?: //' | head -60 | awk '{printf "%s%%0A", $0}')"
          [ -f connected.log ] && echo "::notice title=connected test::$( { grep -E 'Tests on|FAILED|BUILD|What went wrong|Exception|Error' -A4 connected.log | head -80; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
          for x in app/build/outputs/androidTest-results/connected/debug/*.xml ripplebench/build/outputs/androidTest-results/connected/debug/*.xml app/build/outputs/androidTest-results/connected/*.xml ripplebench/build/outputs/androidTest-results/connected/*.xml; do
            [ -f "$x" ] && python3 -c "
          import sys,xml.etree.ElementTree as E
          r=E.parse(sys.argv[1]).getroot(); out=[]
          for tc in r.iter('testcase'):
              f=tc.find('failure'); out.append(('FAIL ' if f is not None else 'PASS ')+tc.get('classname','').split('.')[-1]+'.'+tc.get('name')+(' :: '+f.text[:600].replace(chr(10),' ') if f is not None else ''))
          print('::notice title=instrumented '+sys.argv[1].split('/')[0]+'::'+'%0A'.join(out))" "$x"
          done
