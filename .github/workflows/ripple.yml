name: Ripple G3 (silent)

# Experimental spectral-ripple engine: unit tests, isolation checks, silent bench APK, emulator run without audio.
on:
  push:
    branches: [main]
    paths: ["ripple/**", "ripplebench/**", ".github/workflows/ripple.yml", "settings.gradle.kts", "build.gradle.kts", "app/build.gradle.kts"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Isolation and no-audio checks
        run: |
          set -e
          # the production app must not reference or depend on the experimental modules
          if grep -rn "com.tinnitusrelief.ripple" app/src; then echo "::error::app references the ripple package"; exit 1; fi
          if grep -n 'project(":ripple' app/build.gradle.kts; then echo "::error::app depends on a ripple module"; exit 1; fi
          # no audio-output (or input) API anywhere in the experimental modules
          if grep -rnE "AudioTrack|AAudio|MediaPlayer|SoundPool|ExoPlayer|media3|OpenSL|[Oo]boe|AudioRecord|ToneGenerator|Ringtone|JetPlayer" ripple/src ripplebench/src; then
            echo "::error::audio API found in experimental modules"; exit 1; fi
          echo "::notice title=isolation::app has no ripple dependency; no audio-output API in ripple or ripplebench"
      - name: Ripple unit tests
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :ripple:test 2>&1 | tee ripple-test.log
      - name: App dependency check
        run: |
          ./gradlew --no-daemon --console=plain -q :app:dependencies --configuration debugRuntimeClasspath > deps.txt
          if grep -n "project :ripple" deps.txt; then echo "::error::app runtime classpath contains ripple"; exit 1; fi
      - name: Build silent bench APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :ripplebench:assembleDebug :ripplebench:assembleDebugAndroidTest 2>&1 | tee bench-build.log
          cp ripplebench/build/outputs/apk/debug/ripplebench-debug.apk RippleBench-silent.apk
      - name: Report results
        if: always()
        run: |
          for f in ripple-test.log bench-build.log; do
            [ -f "$f" ] || continue
            msg=$( { grep -E "^e: |FAILED|PASSED" "$f" | head -60; grep -A12 "What went wrong" "$f" | head -30; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
            [ -n "$msg" ] && echo "::notice title=$f::$msg"
          done
          if [ -d ripple/build/test-results/test ]; then
            python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          t=f=0; out=[]
          for x in glob.glob('ripple/build/test-results/test/*.xml'):
              r=ET.parse(x).getroot(); t+=int(r.get('tests')); f+=int(r.get('failures'))+int(r.get('errors'))
              so=r.find('system-out')
              if so is not None and so.text: out+= [l for l in so.text.splitlines() if 'JVM pacing' in l]
          print(f"::notice title=ripple tests::{t} tests, {f} failed%0A" + "%0A".join(out))
          PY
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ripplebench
          path: |
            RippleBench-silent.apk
            ripplebench/build/outputs/apk/androidTest/debug/*.apk
      - name: Publish silent bench (separate pre-release, not the app's release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ripplebench
          name: Ripple bench (silent, G3)
          body: "Silent validation app for the experimental engine. It produces no sound. Commit ${{ github.sha }}."
          prerelease: true
          make_latest: false
          files: RippleBench-silent.apk

  emulator:
    needs: tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Instrumented silent bench on an emulator without audio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -no-audio -gpu swiftshader_indirect -no-snapshot -no-boot-anim
          disable-animations: true
          script: |
            adb logcat -c
            ./gradlew --no-daemon --console=plain :ripplebench:connectedDebugAndroidTest > connected.log 2>&1 || (adb logcat -d -s RippleBenchReport:I RippleBench:I AndroidRuntime:E TestRunner:E > bench-logcat.txt; exit 1)
            adb logcat -d -s RippleBenchReport:I > bench-logcat.txt
      - name: Report emulator results
        if: always()
        run: |
          [ -f bench-logcat.txt ] && echo "::notice title=emulator bench::$(sed 's/%/%25/g' bench-logcat.txt | sed -E 's/^.*RippleBench(Report)?: //' | head -60 | awk '{printf "%s%%0A", $0}')"
          [ -f connected.log ] && echo "::notice title=connected test::$( { grep -E 'Tests on|FAILED|BUILD|What went wrong' -A3 connected.log | head -40; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"
