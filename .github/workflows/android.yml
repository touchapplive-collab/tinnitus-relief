name: Android build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # pinned image: it ships the Android SDK, so no extra setup step is needed
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (DSP)
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:testDebugUnitTest 2>&1 | tee test.log
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew --no-daemon --console=plain :app:assembleDebug 2>&1 | tee build.log
      - name: Report errors as annotations
        if: failure()
        run: |
          for f in test.log build.log; do
            [ -f "$f" ] || continue
            msg=$( { grep -E "^e: " "$f" | head -40; grep -A12 "What went wrong" "$f" | head -30; grep -E "AAPT|error:" "$f" | head -20; } | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}' )
            [ -n "$msg" ] && echo "::error title=$f::$msg"
          done
      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk TinnitusRelief.apk
      - uses: actions/upload-artifact@v4
        with:
          name: TinnitusRelief-apk
          path: TinnitusRelief.apk
      # Direct download link for the phone (no GitHub login, no zip):
      # https://github.com/<owner>/<repo>/releases/latest/download/TinnitusRelief.apk
      - name: Move the latest tag to this commit
        run: |
          git tag -f latest
          git push -f origin latest
      - name: Publish to "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          body: "Automatski build iz grane main (commit ${{ github.sha }})."
          make_latest: true
          files: TinnitusRelief.apk
